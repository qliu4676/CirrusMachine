# All settings are optional: omitted keys use ModelingConfig defaults.
# Angular sizes are arcsec unless the name explicitly says pixels.

# Main settings: check these against the input data and science region.
device: auto  # CUDA when available, otherwise CPU.
pixel_scale: 0.9
beam_FWHM: 36.0  # Effective resolution of the supplied coarse guide.
beta_grid: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5]  # Calibrate P(k) proportional to k^-beta.
core_radius: 32.0
core_taper: 5.0
sky_annulus: [180.0, 220.0]
inner_refit: true

# Wavelet settings supported by this implementation.
scales: 5
orientations: 8

# Advanced statistics and prior controls: usually retain these defaults.
minimum_kernel_coverage: 0.55
orientation_pool_FWHM: 54.6
texture_highpass_FWHM: 40.249
CDF_FWHM: 40.24922359499622
split_sigma_pixels: 12.0
broad_length_pixels: 60.0
prior_lowpass_pixels: 30.0
prior_weight: 5.0
weights: [1.0, 0.1, 1.0, 1.0, 0.01, 2.0]  # S1/S2, P00, coarse, CDF, orientation, optical.
calibration_min_support: 0.5
reference_count: 16
validation_count: 8

# Optimization controls: optional tuning for convergence and runtime.
steps: 100
learning_rates: [0.005, 0.003, 0.001]
stage_steps: [40, 30, 30]  # Duration of each learning rate, totaling 100 steps.
halo_refresh_steps: 10
target_refresh_steps: 25
halo_damping: 0.5

# Optional reproducibility controls: usually keep the seed values unchanged.
# Noise seeds define the correction ensemble, not additional output realizations.
noise_seeds: [990000, 990001, 990002, 990003, 990004, 990005, 990006, 990007]
# One output using the existing representative draw; add entries for more outputs.
draws: [{broad: 2711003, texture: 2721003}]
# Independent phases for the frozen likelihood discrepancy allowance.
allowance_seeds: {broad: 2711000, texture: 2721000}
